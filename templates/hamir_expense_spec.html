<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expense specification — preview</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; color:#111; margin:0; background:#f1f5f9; }
  .bar { background:#1e293b; padding:10px 20px; display:flex; gap:10px; align-items:center; }
  .bar button, .bar a { background:#3b82f6; color:#fff; border:none; padding:6px 14px; border-radius:6px; font-size:13px; text-decoration:none; cursor:pointer; }
  .bar a.alt { background:#475569; }
  .page { background:#fff; width:210mm; min-height:140mm; margin:18px auto; padding:16mm; box-sizing:border-box; box-shadow:0 1px 6px rgba(0,0,0,.15); font-size:12.5px; line-height:1.5; }
  table { width:100%; border-collapse:collapse; } table.fee th { text-align:left; font-size:11px; border-bottom:1.5px solid #111; padding:6px; } table.fee td { padding:6px; border-bottom:.5px solid #ccc; vertical-align:top; }
  .r { text-align:right; font-variant-numeric:tabular-nums; } .tot td { font-weight:700; border-top:1.5px solid #111; border-bottom:none; }
  @media print { body { background:#fff; } .bar { display:none; } .page { margin:0; box-shadow:none; width:auto; padding:0; } }
</style></head><body>
<div class="bar"><button onclick="window.print()">Print / Save as PDF</button><a class="alt" href="/hamir-advisors">← Back</a>
  <span style="color:#94a3b8;font-size:12px;margin-left:auto;">Preview of the expense specification that will go with the next {{ inv.client }} invoice</span></div>
<div class="page">
  {% if letterhead %}{% include "_hamir_letterhead.html" %}{% endif %}
  {% include "_hamir_expense_spec.html" %}
</div>
</body></html>
